[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hypospace"
version = "0.1.7"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui       = ["streamlit"]
nnsight  = ["nnsight", "torch"]
pyvene   = ["pyvene", "torch"]
cache    = ["diskcache"]
notebook = ["jupyter", "nbconvert", "plotly"]
dev      = ["pytest"]

[project.scripts]
hypospace = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "data*", "interpretability*", "viz*"]
